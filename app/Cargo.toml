[package]
name = "yescharge"
description = "Batería de tus periféricos inalámbricos en la bandeja de Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "YesCharge"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Com", "Win32_UI_HiDpi"] }
yescharge-core = { version = "0.1.1", path = "../core" }

[build-dependencies]
embed-resource = "3.0.12"
