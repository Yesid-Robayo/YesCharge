[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["Yesid Robayo"]
repository = "https://github.com/Yesid-Robayo/YesCharge"

# Binario pequeño: optimizado por tamaño, LTO completo, sin símbolos
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
